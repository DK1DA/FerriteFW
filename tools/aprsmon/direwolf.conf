# Direwolf for the APRS monitor (tools/aprsmon): receive only, audio from rtl_fm on stdin (run.sh).
# Never transmits: no PTT, no beacons, no digipeating.
ADEVICE stdin null
ACHANNELS 1
CHANNEL 0
MYCALL N0CALL
MODEM 1200
# Live frames for our tools over KISS/TCP (e.g. a test script on the Mac: THIS-HOST:8001).
KISSPORT 8001
AGWPORT 0

# Receive-only iGate, off: to forward what it hears to APRS-IS (aprs.fi), set MYCALL to your callsign-SSID
# (e.g. VA7XXX-10) and uncomment the two lines with your APRS-IS passcode. Receive only: no IGTXVIA.
#IGSERVER noam.aprs2.net
#IGLOGIN VA7XXX-10 12345
