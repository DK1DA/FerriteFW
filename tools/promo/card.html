<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: JBM; src: url("{{FONTS}}/JetBrainsMono-Regular.ttf"); }
@font-face { font-family: JBM; font-weight: 700; src: url("{{FONTS}}/JetBrainsMono-Bold.ttf"); }
@font-face { font-family: Barlow; font-weight: 600; src: url("{{FONTS}}/BarlowSemiCondensed-SemiBold.ttf"); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { background: radial-gradient(ellipse at 50% 40%, #121722 0%, #07080a 70%); color: #e6e8eb; font-family: JBM, monospace; }
.col { position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
.al { text-align: right; align-items: flex-end; }
h1 { font-family: Barlow, sans-serif; font-weight: 600; font-size: 70px; line-height: 1.02; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; font-size: 30px; line-height: 1.45; color: #a7b0bb; }
.bezel { position: absolute; border-radius: 26px; background: #0b0d10; box-shadow: 0 0 0 2px #1d232c, 0 30px 90px rgba(0,0,0,.65); }
.n { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 15px; color: #4a525c; letter-spacing: 0.2em; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
.center h1 { font-size: 120px; }
.center p { max-width: 900px; font-size: 34px; }
.logo { width: 150px; height: 150px; }
</style></head><body>
{{BODY}}
</body></html>
