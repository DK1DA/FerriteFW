name: release
# Runs only when a release is published (or by hand from the Actions tab), so the one worker isn't busy on every
# push. Everything runs here, the sim UI tests too (no Xeon to share them with): slower, but complete. Two images go
# out: the user build (tx) as ferrite-VERSION.btf and Console's backup reader, with the build report and UI results.
# The receive-only and tx-bench images aren't built here (tx-bench is for local bench work only).
on:
  release:
    types: [published]
  workflow_dispatch:

# One at a time: a second release waits for the first rather than sharing the worker.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: docker
    container:
      image: node:20-bookworm # checkout needs node; the rest is installed below
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Packages
        run: |
          apt-get update -q
          # python3: the tools (stdlib only); binutils-arm-none-eabi: slowcheck and the build report;
          # the X11/Wayland headers: the simulator's window library (minifb) builds against them, even headless.
          apt-get install -y -q --no-install-recommends python3 binutils-arm-none-eabi pkg-config \
            libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Rust (the nightly pinned in rust-toolchain.toml)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install # reads rust-toolchain.toml
          "$HOME/.cargo/bin/cargo" install -q --locked cargo-llvm-cov # the build report's coverage

      - name: Host tests
        run: |
          # Run once, under coverage: the build report counts these logs and reports this run's coverage. The store's
          # power-cut and chip-gone tests run about 40 times slower instrumented (11 s plain, over 7 min covered), so
          # they're skipped here and run plainly in the bench build below (store coverage 96.7 -> 92.7 %).
          mkdir -p target/ci
          cargo llvm-cov --no-report -q -- --skip chip_gone --skip power_cut 2>&1 | tee target/ci/host-tests.log
          cargo llvm-cov --no-report -q -p uradio-bus -p bk4829 -p si4732 -p st7789 -p w25q -p keypad -p nmea \
            --all-features 2>&1 | tee target/ci/driver-tests.log
          cargo test -q --features ferrite-app/bench,ferrite-radio/bench,ferrite-sim/bench
      - name: Lints
        run: |
          cargo clippy -q --all-targets -- -D warnings
          cargo clippy -q --all-targets --features ferrite-app/bench,ferrite-radio/bench,ferrite-sim/bench -- -D warnings
          cargo fw-clippy -q -- -D warnings
          cargo fw-clippy -q --features tx -- -D warnings
          cargo fw-clippy -q --features tx-bench -- -D warnings
          cargo fw-clippy -q --features bench -- -D warnings
      - name: Sim UI tests
        run: python3 tools/uitest.py --sim auto -j "$(nproc)" --results target/ci-ui

      # Every run, by hand too, keeps target/out as a download on the run's page: the two images, SHA256SUMS, their
      # signatures, the build report and the UI results.
      - name: Images
        run: |
          tools/mkbtf.sh tx
          tools/mkbtf.sh reader
          # The release tag without a leading v (v0.9 -> ferrite-0.9.btf); a run by hand uses the commit.
          tag="${{ github.event.release.tag_name }}"
          ver="${tag#v}"
          mkdir -p target/out
          cp target/ferrite-tx.btf "target/out/ferrite-${ver:-$(git rev-parse --short HEAD)}.btf"
          cp target/ferrite-reader.btf target/out/
          (cd target/out && sha256sum *.btf > SHA256SUMS)
      # The images and SHA256SUMS signed with minisign (a .minisig beside each), once the MINISIGN_KEY secret is set:
      # the secret key file's contents, made without a password (minisign -G -W); the public key ships in Console.
      - name: Sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          apt-get install -y -q --no-install-recommends minisign # also the build report's check
          if [ -z "$MINISIGN_KEY" ]; then echo "no MINISIGN_KEY secret: not signed"; exit 0; fi
          # The key file is a comment line and the key's base64 line; the secret may hold the base64 line alone or
          # both joined into one, so rebuild the file around the base64.
          b64=$(printf '%s' "$MINISIGN_KEY" | grep -oE 'RW[A-Za-z0-9+/]{100,}={0,2}' | tail -1)
          key=$(mktemp)
          printf 'untrusted comment: minisign encrypted secret key\n%s\n' "$b64" > "$key"
          cd target/out
          minisign -S -s "$key" -t "Ferrite ${TAG:-build} $(git rev-parse --short HEAD)" -m *.btf SHA256SUMS
          rm "$key"
          # Each signature checked against the public key in the repo (the one Console carries): a wrong secret fails here.
          for f in *.btf SHA256SUMS; do minisign -Vqm "$f" -p ../../minisign.pub; done
          echo "signed: $(ls *.minisig | tr '\n' ' ')"
      # Only reads what the steps above made (the tests' logs and coverage, the UI results, the image and its
      # signature): nothing is built or run again.
      - name: Build report
        run: |
          ui=$(ls -t target/ci-ui/*/ui/results.json | head -1)
          sig=$(ls target/out/ferrite-*.btf.minisig 2>/dev/null | grep -v reader | head -1)
          python3 tools/buildreport.py tx --no-build --ui "$ui" ${sig:+--sig "$sig"} \
            --from-logs target/ci/host-tests.log target/ci/driver-tests.log
          cp "$ui" target/out/ui-results.json
          # Only the tx build ships, so the report drops the build from its name.
          cp target/build-report-tx.html target/out/build-report.html
          cp target/build-report-tx.json target/out/build-report.json
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ferrite-images.zip # the download is a zip; Forgejo names the file after this
          path: target/out/

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          # RELEASE_TOKEN (a repository secret with write access to releases) if set, else the run's own token.
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets
        run: |
          cd target/out
          for f in *.btf *.minisig SHA256SUMS build-report.html ui-results.json; do # build-report.json: the run's download only
            curl -sSf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$API?name=$f" > /dev/null
            echo "attached $f"
          done
