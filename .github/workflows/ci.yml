name: ci
# Paused: udigimodes is private, and the DEPS_TOKEN secret that reads them is not set up yet.
# To turn CI back on, add the secret and restore the triggers:
#   on: [push, pull_request]
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # udigimodes is private: a token with read access to it (repository secret DEPS_TOKEN).
      - run: git config --global url."https://x-access-token:${{ secrets.DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"
      # rust-toolchain.toml picks the pinned nightly and its components.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test
      # The bench commands (decision 151): the host crates with and without the `bench` feature.
      - run: cargo test --features ferrite-app/bench,ferrite-radio/bench,ferrite-sim/bench
      - run: cargo test -p uradio-bus -p bk4829 -p si4732 -p st7789 -p w25q -p keypad -p nmea --all-features  # the drivers with their tx and mock features
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features ferrite-app/bench,ferrite-radio/bench,ferrite-sim/bench -- -D warnings
      - run: cargo fw-clippy -- -D warnings
      - run: cargo fw-clippy --features tx -- -D warnings
      - run: cargo fw-clippy --features tx-dry -- -D warnings  # tx + bench + dry
      - run: cargo fw-clippy --features bench -- -D warnings
      - run: cargo fw-bringup  # the first image on a new radio (bench commands in); not in the per-change checks
      - run: cargo fw --features tx  # a user build: no bench commands
      - run: cargo fw --features tx-dry  # the first transmit build on a radio: PA drive held at 0, bench commands in
      - run: cargo fw  # last, so the size below is the receive-only image's
      - name: Size, and no core::fmt in the image
        run: |
          BIN=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin
          ELF=target/thumbv7em-none-eabihf/release/ferrite
          $BIN/llvm-size $ELF | tee -a $GITHUB_STEP_SUMMARY
          ! $BIN/llvm-nm $ELF | grep -q 'core..fmt'
