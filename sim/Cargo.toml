[package]
name = "ferrite-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Ferrite's screens on the PC with the firmware's own drawing code: PNGs, or an interactive window"
# `cargo sim` / `cargo simw` run the simulator, not the video recorder.
default-run = "ferrite-sim"

[lib]
name = "ferrite_sim"
path = "src/lib.rs"

[[bin]]
name = "ferrite-sim"
path = "src/main.rs"

# The SPI parts for a build (decision 335): tools/mkbtf.sh packs them into the .ffw.
[[bin]]
name = "ferrite-mkparts"
path = "src/bin/mkparts.rs"

# Records the simulator for videos (tools/promo/mkvideo.py).
[[bin]]
name = "ferrite-sim-record"
path = "src/bin/record.rs"

[features]
# The fake radio's answers to the terminal's bench commands (decision 151); the sims are user builds without it.
bench = ["ferrite-core/bench", "ferrite-app/bench"]

[dependencies]
ferrite-core.workspace = true
ferrite-app = { workspace = true, features = ["vt100"] }
ferrite-ui = { workspace = true, features = ["std"] }
ferrite-store = { workspace = true, features = ["std"] }

# The PNGs and the desktop window; the library builds for wasm32 without them (sim-web).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"
minifb = "0.27"
# The terminal's cable: a pseudo-terminal (openpty).
libc = "0.2"

# The end-to-end tests note text the drawing cut off (ferrite-ui's `clipcheck`; not in the sims or the radio).
[dev-dependencies]
ferrite-ui = { workspace = true, features = ["std", "clipcheck"] }

[lints]
workspace = true
