[package]
name = "ferrite-sim"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
description = "Ferrite's screens on the PC with the firmware's own drawing code: PNGs, or an interactive window"

[lib]
name = "ferrite_sim"
path = "src/lib.rs"

[[bin]]
name = "ferrite-sim"
path = "src/main.rs"

[dependencies]
ferrite-core.workspace = true
ferrite-app.workspace = true
ferrite-ui = { workspace = true, features = ["std"] }

# The PNGs and the desktop window; the library builds for wasm32 without them (sim-web).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"
minifb = "0.27"

[lints]
workspace = true
