[workspace]
resolver = "2"
members = ["crates/ferrite-core", "crates/ferrite-ui", "crates/ferrite-app", "crates/ferrite-store", "crates/ferrite-checks", "crates/ferrite-radio", "firmware", "sim", "sim-web", "drivers/bus", "drivers/bk4829", "drivers/si4732", "drivers/st7789", "drivers/w25q", "drivers/keypad", "drivers/nmea"]
# Plain `cargo test` / `cargo clippy` cover what runs on the PC; the firmware builds with `cargo fw` (radio only).
default-members = ["crates/ferrite-core", "crates/ferrite-ui", "crates/ferrite-app", "crates/ferrite-store", "crates/ferrite-checks", "crates/ferrite-radio", "sim", "drivers/bus", "drivers/bk4829", "drivers/si4732", "drivers/st7789", "drivers/w25q", "drivers/keypad", "drivers/nmea"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/infamy/ferrite"
publish = false

[workspace.dependencies]
ferrite-core = { path = "crates/ferrite-core" }
ferrite-ui = { path = "crates/ferrite-ui" }
ferrite-app = { path = "crates/ferrite-app" }
ferrite-store = { path = "crates/ferrite-store", default-features = false }
ferrite-radio = { path = "crates/ferrite-radio" }
ufmt = "0.2"
embassy-sync = "0.8"

# Chip drivers (drivers/, uradio until Oct 13, 2026), then the digital modes: our own library, pinned to a commit.
uradio-bus = { path = "drivers/bus" }
bk4829 = { path = "drivers/bk4829" }
si4732 = { path = "drivers/si4732" }
st7789 = { path = "drivers/st7789" }
w25q = { path = "drivers/w25q" }
keypad = { path = "drivers/keypad" }
uafsk = { git = "https://github.com/infamy/udigimodes", rev = "" }
upocsag = { git = "https://github.com/infamy/udigimodes", rev = "" }
udsp = { git = "https://github.com/infamy/udigimodes", rev = "" }
udsc = { git = "https://github.com/infamy/udigimodes", rev = "" }
uaprs = { git = "https://github.com/infamy/udigimodes", rev = "", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"       # the radio target's rustflags add -Cpanic=immediate-abort after this, which wins
debug = true          # symbols only; not in the flashed image

# The web simulator (`cargo simweb`): release without debug info, stripped.
[profile.wasm]
inherits = "release"
debug = false
strip = true

[profile.test]
opt-level = 1

[workspace.lints.clippy]
# The drawing calls take position, text, font and two colours; register constants spell out bit 0 shifts; the
# fault paths halt in an empty loop on purpose (interrupts off, safe state set).
too_many_arguments = "allow"
new_without_default = "allow"
identity_op = "allow"
empty_loop = "allow"
