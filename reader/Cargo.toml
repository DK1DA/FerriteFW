[package]
name = "ferrite-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The reader image: Ferrite Console loads it through the stock bootloader to back a radio's SPI flash up, read only by construction (decision 264)"

[[bin]]
name = "ferrite-reader"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferrite-core.workspace = true
ferrite-ui.workspace = true
ufmt.workspace = true
uradio-bus.workspace = true
st7789.workspace = true
# Read only: without its `write` feature the driver has no program, erase or write enable at all (BACKUP-9.5).
w25q.workspace = true
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["set-sp", "set-vtor", "device"] }
critical-section = "1.2"
# The firmware's HAL (firmware/src/hal, shared by path) is built whole; these are what its other parts use.
embassy-sync.workspace = true
embassy-time = "0.5"
embassy-time-driver = { version = "0.2", features = ["tick-hz-2_000"] }
embassy-time-queue-utils = "0.3"

[lints]
workspace = true
