[package]
name = "ferrite-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Ferrite's screens and drawing layer: 4-bit anti-aliased text and masks straight to any Panel (the ST7789, or a frame buffer on the PC)"

[features]
# The PC frame buffer (`fb`), for the simulator and snapshot tests.
std = []
# The drawing profile (`prof`): bench builds.
prof = []
# Host tests: text the drawing cut off without being asked to ([`clipcheck`]); never in the radio's image.
clipcheck = ["std"]

[dependencies]
ufmt.workspace = true
ferrite-core.workspace = true

[lints]
workspace = true
